<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFBFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121A21" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved light/dark choice before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

      content="8 years building REST APIs, integrations and business systems with Python and Django."
