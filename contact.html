<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFBFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121A21" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint (see src/lib/theme.ts): a saved Light or
      // Dark choice, otherwise Auto: light from 6:00 to 18:00 local time.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          var h = new Date().getHours()
          t = h >= 6 && h < 18 ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <title>Contact | Rowegie P. Lambojon</title>
    <meta
      name="description"
      content="Get in touch with Rowegie P. Lambojon, a backend-focused full-stack developer based in Lapu-Lapu City, Cebu, Philippines."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact | Rowegie P. Lambojon" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Rowegie P. Lambojon, backend-focused full-stack developer in Lapu-Lapu City, Cebu, Philippines.</p>
      <p>Email: <a href="mailto:rowegie.lambojon@gmail.com">rowegie.lambojon@gmail.com</a></p>
    </noscript>
    <script type="module" src="/src/contact.tsx"></script>
  </body>
</html>
