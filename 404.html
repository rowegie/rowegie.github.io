<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Rowegie P. Lambojon</title>
    <script>
      // GitHub Pages shows this page for any unknown address. Old or typed
      // addresses with a trailing slash (/projects/) go to the clean one.
      ;(function () {
        var path = location.pathname
        if (path.length > 1 && path.charAt(path.length - 1) === '/') {
          location.replace(path.replace(/\/+$/, '') + location.search + location.hash)
        }
      })()
    </script>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #fafbfa;
        color: #16202a;
        text-align: center;
      }
      a { color: #2c5e8a; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { background: #121a21; color: #e8ecee; }
        a { color: #8db8de; }
      }
    </style>
  </head>
  <body>
    <h1 style="margin: 0; font-size: 1.5rem">Page not found</h1>
    <p style="margin: 0">There's nothing at this address.</p>
    <p style="margin: 0"><a href="%BASE_URL%">Go to the home page</a></p>
  </body>
</html>
